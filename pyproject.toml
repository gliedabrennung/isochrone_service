[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "integration: requires a running docker compose stack",
    "geo: geometric invariants GEO-01..GEO-08 from the specification",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "api/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "support"]
