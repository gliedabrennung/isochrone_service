services:
  api:
    build:
      target: dev
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /srv/app
    environment:
      LOG_LEVEL: DEBUG
    volumes:
      - ./api/app:/srv/app:ro
      - app_data:/data:ro
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/app.js:/usr/share/nginx/html/app.js:ro
      - ./web/style.css:/usr/share/nginx/html/style.css:ro

  valhalla:
    ports:
      - "8002:8002"

  redis:
    ports:
      - "6379:6379"
