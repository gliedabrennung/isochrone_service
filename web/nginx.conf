server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16k;
    client_body_timeout 10s;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/geo+json application/problem+json;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        error_page 502 504 = @api_down;
    }

    location = /metrics {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        error_page 502 504 = @api_down;
    }

    location @api_down {
        default_type application/problem+json;
        return 503 '{"type":"https://isochrone.local/errors/engine-unavailable","title":"Routing engine is unavailable","status":503,"detail":"API is not reachable yet. Valhalla tiles are probably still being built, see: docker compose logs -f valhalla","instance":"/api/v1","code":"ENGINE_UNAVAILABLE"}';
    }

    error_page 413 = @too_large;

    location @too_large {
        default_type application/problem+json;
        return 400 '{"type":"https://isochrone.local/errors/validation-error","title":"Request validation failed","status":400,"detail":"Request body exceeds the 16384 byte limit.","instance":"/api/v1","code":"VALIDATION_ERROR"}';
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
